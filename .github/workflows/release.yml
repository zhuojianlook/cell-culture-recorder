name: Release

# Publishes a signed macOS build to a GitHub Release whenever a version tag is
# pushed (e.g. `git tag v0.1.4 && git push origin v0.1.4`). The in-app updater
# reads the `latest.json` asset from the latest release, so each tagged build is
# delivered to already-installed copies via "Check updates".
#
# Resilience: macOS DMG bundling (bundle_dmg.sh / Finder AppleScript) is
# intermittently flaky on GitHub runners. That failure happens during the BUILD,
# before any release is created, so a failed attempt leaves nothing behind. We
# therefore run the build-and-publish step up to 3 times — each retry only fires
# if the previous attempt failed. The Rust cache makes retries fast, and three
# independent attempts take the ~20% per-attempt flake to well under 1%.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.4). Created from the current ref if it does not exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner -> aarch64 build, matching the existing releases and
    # the developer's test machine.
    runs-on: macos-14
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Minisign key for the Tauri updater. Must match the pubkey baked into
      # tauri.conf.json, or installed apps will reject the update.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Gate the release on the unit tests — a culture-logic regression should
      # fail fast, before the long Rust/sidecar build.
      - name: Run unit tests
        run: node --test tests/

      # Compile the WetlabPlanner Express server into the bundled `api-server`
      # sidecar (Node SEA single binary). Must run before tauri-action so the
      # binary exists in src-tauri/binaries/ when the app is bundled.
      - name: Build Node sidecar (api-server)
        run: bash scripts/build-sidecar.sh aarch64-apple-darwin

      - name: Build and publish release (attempt 1)
        id: release1
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-apple-darwin
          # On a tag push, github.ref_name is the tag; on manual dispatch, use the input.
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "WetLab Planner __VERSION__"
          releaseBody: |
            Automated Apple Silicon build for __VERSION__. First install: open the
            `.dmg` and drag **WetLab Planner** into Applications (first launch:
            right-click the app -> Open once to clear Gatekeeper). After that, the app
            checks for updates on launch and installs them in place.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Build and publish release (attempt 2)
        id: release2
        if: steps.release1.outcome == 'failure'
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-apple-darwin
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "WetLab Planner __VERSION__"
          releaseBody: |
            Automated Apple Silicon build for __VERSION__. First install: open the
            `.dmg` and drag **WetLab Planner** into Applications (first launch:
            right-click the app -> Open once to clear Gatekeeper). After that, the app
            checks for updates on launch and installs them in place.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Verify bundled sidecar JIT entitlements
        if: steps.release1.outcome == 'success'
        continue-on-error: true
        run: |
          APP=$(find src-tauri/target -path "*bundle/macos/*.app" -maxdepth 6 -type d | head -1)
          echo "App bundle: $APP"
          SIDE=$(find "$APP/Contents/MacOS" -name "api-server*" 2>/dev/null | head -1)
          echo "Sidecar: $SIDE"
          echo "--- codesign entitlements (expect allow-jit = true) ---"
          codesign -d --entitlements :- "$SIDE" 2>&1 || true
          echo "--- codesign verify ---"
          codesign -dvv "$SIDE" 2>&1 | grep -iE "flags|signature|runtime" || true

      - name: Build and publish release (attempt 3)
        id: release3
        if: steps.release1.outcome == 'failure' && steps.release2.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target aarch64-apple-darwin
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "WetLab Planner __VERSION__"
          releaseBody: |
            Automated Apple Silicon build for __VERSION__. First install: open the
            `.dmg` and drag **WetLab Planner** into Applications (first launch:
            right-click the app -> Open once to clear Gatekeeper). After that, the app
            checks for updates on launch and installs them in place.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
