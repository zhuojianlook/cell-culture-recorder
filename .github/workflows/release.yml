name: Release

# Publishes a signed macOS build to a GitHub Release whenever a version tag is
# pushed (e.g. `git tag v0.1.4 && git push origin v0.1.4`). The in-app updater
# reads the `latest.json` asset from the latest release, so each tagged build is
# delivered to already-installed copies via "Check updates".
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.4). Created from the current ref if it does not exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    # Apple Silicon runner -> aarch64 build, matching the existing releases and
    # the developer's test machine.
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign key for the Tauri updater. Must match the pubkey baked into
          # tauri.conf.json, or installed apps will reject the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin
          # On a tag push, github.ref_name is the tag; on manual dispatch, use the input.
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Cell Culture Recorder __VERSION__"
          releaseBody: |
            Automated build for __VERSION__ (Apple Silicon, unsigned/ad-hoc).

            First install: download the `.dmg`, open it, and drag **Cell Culture Recorder**
            into Applications. On first launch, right-click the app -> Open once to clear
            Gatekeeper (or run
            `xattr -dr com.apple.quarantine "/Applications/Cell Culture Recorder.app"`).
            After that, use "Check updates" inside the app to pull future versions
            (delivered via the `.app.tar.gz` updater bundle).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
